<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lius Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <div class="auth-content">
                <div class="logo-section">
                    <div class="logo">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="48" height="48" rx="12" fill="#1E40AF"/>
                            <path d="M14 34V14H19V29H29V34H14Z" fill="white"/>
                            <circle cx="32" cy="20" r="4" fill="#3B82F6"/>
                        </svg>
                    </div>
                    <h1 class="logo-text">Lius</h1>
                </div>
                
                <div class="auth-form-wrapper">
                    <h2 class="auth-title">Welcome back</h2>
                    <p class="auth-subtitle">Sign in to continue to your dashboard</p>
                    
                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-input" 
                                placeholder="you@example.com"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="••••••••"
                                required
                            >
                        </div>
                        
                        <button type="submit" class="btn-primary btn-full">
                            <span class="btn-text">Sign In</span>
                            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </form>
                    
                    <div class="auth-footer">
                        <p>Don't have an account? <a href="signup.html" class="auth-link">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="auth-right">
            <div class="auth-visual">
                <div class="floating-card card-1">
                    <div class="card-icon">💰</div>
                    <div class="card-content">
                        <div class="card-label">Total Balance</div>
                        <div class="card-value">$24,580.00</div>
                    </div>
                </div>
                
                <div class="floating-card card-2">
                    <div class="card-icon">📈</div>
                    <div class="card-content">
                        <div class="card-label">Monthly Growth</div>
                        <div class="card-value">+12.5%</div>
                    </div>
                </div>
                
                <div class="floating-card card-3">
                    <div class="card-icon">💳</div>
                    <div class="card-content">
                        <div class="card-label">Active Cards</div>
                        <div class="card-value">3</div>
                    </div>
                </div>
                
                <div class="gradient-orb orb-1"></div>
                <div class="gradient-orb orb-2"></div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
