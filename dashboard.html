<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lius Finance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-section">
                    <div class="logo">
                        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="48" height="48" rx="12" fill="#1E40AF"/>
                            <path d="M14 34V14H19V29H29V34H14Z" fill="white"/>
                            <circle cx="32" cy="20" r="4" fill="#3B82F6"/>
                        </svg>
                    </div>
                    <h1 class="logo-text">Lius</h1>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M6 18L18 6M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="transactions.html" class="nav-item">
                    <span class="nav-text">Transactions</span>
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-text">Logout</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">
                        <span id="userInitials">U</span>
                    </div>
                    <div class="user-info">
                        <div class="user-name" id="userName">User</div>
                        <div class="user-email" id="userEmail">user@example.com</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <h1>Welcome, <span id="dashboardUserName">User</span></h1>
            <p>This is your dashboard.</p>
        </main>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <!-- REMOVE Firebase -->
    <!-- <script type="module" src="js/firebase.js"></script> -->

    <!-- LocalStorage dashboard script -->
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
